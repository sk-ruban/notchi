name: Build & Test

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/test/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('notchi/notchi.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build and test
        run: ./scripts/test.sh all

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: build/test/TestResults.xcresult
