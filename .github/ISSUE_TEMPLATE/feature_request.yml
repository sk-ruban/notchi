name: Feature Request
description: Suggest an idea or improvement for Notchi
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Notchi to do?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Optional context on where Notchi falls short today.
    validations:
      required: false
